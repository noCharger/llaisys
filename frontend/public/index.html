<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLAISYS Chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; flex-direction: column; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; }
        .message { margin-bottom: 15px; padding: 10px 15px; border-radius: 15px; max-width: 80%; }
        .user-message { background-color: #007bff; color: white; align-self: flex-end; margin-left: auto; }
        .ai-message { background-color: #e9ecef; color: #212529; align-self: flex-start; white-space: pre-wrap; }
        
        /* Thinking Indicator */
        .thinking-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #6c757d;
            font-style: italic;
            font-size: 0.9em;
            margin-bottom: 15px;
            align-self: flex-start;
            padding: 10px 15px;
        }
        .dot {
            width: 6px;
            height: 6px;
            background-color: #6c757d;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-area { padding: 20px; background-color: white; border-top: 1px solid #dee2e6; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">LLAISYS AI Chat</span>
        </div>
    </nav>

    <div id="chat-container" class="d-flex flex-column">
        <!-- Messages will appear here -->
    </div>

    <div class="input-area">
        <div class="container">
            <form id="chat-form" class="d-flex gap-2">
                <input type="text" id="user-input" class="form-control" placeholder="Type your message..." autocomplete="off">
                <button type="submit" class="btn btn-primary">Send</button>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
